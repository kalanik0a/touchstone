# ── Touchstone Default Policy ─────────────────────────────────────
# Format: action:pattern:description
#   action: deny | warn
#   pattern: shell glob matched against the full command string
#
# User overrides: ~/.touchstone/policy.conf
# Rules are evaluated top-to-bottom. First match wins.
#
# NIST 800-53 AC-6: Least Privilege
# OWASP Agentic Top 10: Privilege Escalation Prevention
# ──────────────────────────────────────────────────────────────────

# ── Critical: System Destruction ─────────────────────────────────
deny:*rm -rf /*:Recursive force delete from root
deny:*rm -rf --no-preserve-root*:Explicit root deletion override
deny:*rm -rf /:Root filesystem deletion
deny:*> /dev/sd*:Direct write to block device
deny:*> /dev/nvme*:Direct write to NVMe device
deny:*dd *of=/dev/sd*:Raw disk write via dd
deny:*dd *of=/dev/nvme*:Raw disk write to NVMe via dd
deny:*mkfs*:Filesystem creation or destruction
deny:*wipefs*:Filesystem signature wipe

# ── Critical: Credential Exfiltration ────────────────────────────
deny:*cat /etc/shadow*:Shadow password file access
deny:*cat /etc/gshadow*:Group shadow file access
deny:*cat */id_rsa*:SSH private key access
deny:*cat */id_ed25519*:SSH private key access
deny:*cat */id_ecdsa*:SSH private key access
deny:*cat */.ssh/id_*:SSH private key access via dotpath
deny:*cat *hmac.key*:Touchstone HMAC key access

# ── High: Dangerous Permission Changes ──────────────────────────
deny:*chmod 777 /*:World-writable root path
deny:*chmod -R 777*:Recursive world-writable
deny:*chown -R root*:Recursive ownership takeover

# ── High: Security Control Tampering ─────────────────────────────
deny:*setenforce 0*:SELinux disable
deny:*systemctl disable auditd*:Audit daemon disable
deny:*systemctl stop auditd*:Audit daemon stop
deny:*auditctl -D*:Flush all audit rules
deny:*iptables -F*:Flush all firewall rules
deny:*nft flush*:Flush nftables ruleset

# ── High: Supply Chain ───────────────────────────────────────────
deny:*curl*|*bash*:Piped remote code execution
deny:*curl*|*sh*:Piped remote code execution
deny:*wget*|*bash*:Piped remote code execution
deny:*wget*|*sh*:Piped remote code execution

# ── Medium: Warnings (allowed but flagged) ───────────────────────
warn:*--no-verify*:Git hook bypass
warn:*--force*push*:Force push to remote
warn:*git reset --hard*:Hard reset (destructive)
warn:*git clean -fd*:Force clean untracked files
warn:*shutdown*:System shutdown
warn:*reboot*:System reboot
warn:*systemctl stop*:Service stop
warn:*kill -9*:Force kill process
warn:*pkill*:Pattern-based process kill
